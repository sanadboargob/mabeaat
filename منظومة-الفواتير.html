<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منظومة الفواتير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17262b;
    --ink-soft:#3d5158;
    --paper:#f4f6f4;
    --paper-raised:#ffffff;
    --teal:#1f6f64;
    --teal-dark:#123f3a;
    --teal-tint:#e4efec;
    --amber:#c9791f;
    --amber-tint:#faedd9;
    --line:#dbe2df;
    --danger:#b3452f;
    --danger-tint:#f6e4df;
    --shadow: 0 1px 2px rgba(23,38,43,.06), 0 6px 20px rgba(23,38,43,.06);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.num-display{ font-family:'Cairo', 'Tajawal', sans-serif; }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; }
  .hidden{ display:none !important; }

  /* ---------- Login ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(31,111,100,.14), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(201,121,31,.10), transparent 45%),
      var(--paper);
    padding:20px;
  }
  .login-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    width:100%;
    max-width:380px;
    padding:36px 32px;
  }
  .login-mark{
    width:52px;height:52px;border-radius:12px;
    background:var(--teal);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:22px;
    margin-bottom:18px;
  }
  .login-card h1{ font-size:22px; margin:0 0 4px; color:var(--teal-dark);}
  .login-card p.sub{ margin:0 0 24px; color:var(--ink-soft); font-size:14px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:15px;
    background:#fff;
    color:var(--ink);
    transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--teal);
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:8px; padding:11px 18px; font-size:15px; font-weight:700;
    transition:transform .08s, filter .15s;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--teal); color:#fff; width:100%; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; color:var(--teal-dark); border:1px solid var(--line); }
  .btn-ghost:hover{ background:var(--teal-tint); }
  .btn-danger{ background:var(--danger-tint); color:var(--danger); }
  .btn-danger:hover{ filter:brightness(.96); }
  .btn-amber{ background:var(--amber); color:#fff; }
  .btn-sm{ padding:7px 12px; font-size:13px; }
  .login-hint{
    margin-top:18px; padding:12px 14px; background:var(--teal-tint);
    border-radius:8px; font-size:13px; color:var(--teal-dark); line-height:1.9;
  }
  .login-error{
    background:var(--danger-tint); color:var(--danger); border-radius:8px;
    padding:10px 12px; font-size:13.5px; margin-bottom:14px;
  }

  /* ---------- App shell ---------- */
  #appShell{ display:flex; min-height:100vh; }
  .sidebar{
    width:230px; flex:none;
    background:var(--teal-dark);
    color:#e9f2f0;
    display:flex; flex-direction:column;
    padding:22px 16px;
  }
  .sidebar .brand{
    display:flex; align-items:center; gap:10px; margin-bottom:26px; padding:0 4px;
  }
  .sidebar .brand .mark{
    width:34px;height:34px;border-radius:9px;background:var(--amber);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Cairo',sans-serif;
    flex:none;
  }
  .sidebar .brand .name{ font-weight:700; font-size:15px; line-height:1.3; }
  .sidebar .brand .name small{ display:block; font-size:11px; color:#a9c9c3; font-weight:400; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 12px; border-radius:8px; margin-bottom:3px;
    color:#cfe6e1; font-size:14.5px; font-weight:500;
    border:none; background:transparent; width:100%; text-align:start;
  }
  .nav-item .ic{ width:18px; text-align:center; flex:none; }
  .nav-item:hover{ background:rgba(255,255,255,.06); color:#fff; }
  .nav-item.active{ background:var(--teal); color:#fff; }
  .sidebar-foot{ margin-top:auto; border-top:1px solid rgba(255,255,255,.12); padding-top:14px; }
  .sidebar-user{ font-size:13px; color:#bcded7; margin-bottom:10px; line-height:1.6; }
  .sidebar-user b{ color:#fff; display:block; font-size:14px; }

  .main{ flex:1; min-width:0; }
  .topbar{
    background:var(--paper-raised); border-bottom:1px solid var(--line);
    padding:16px 28px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:5;
  }
  .topbar h2{ margin:0; font-size:19px; color:var(--ink); }
  .content{ padding:26px 28px 60px; max-width:1180px; }

  .grid-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:22px; }
  .stat-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; box-shadow:var(--shadow);
  }
  .stat-card .lbl{ font-size:13px; color:var(--ink-soft); margin-bottom:8px; }
  .stat-card .val{ font-family:'Cairo',sans-serif; font-weight:800; font-size:26px; color:var(--teal-dark); }
  .stat-card.amber .val{ color:var(--amber); }

  .panel{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-bottom:20px;
  }
  .panel-head{
    padding:16px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .panel-head h3{ margin:0; font-size:16px; }
  .panel-body{ padding:20px; }

  table.tbl{ width:100%; border-collapse:collapse; font-size:14.5px; }
  table.tbl th{
    text-align:start; color:var(--ink-soft); font-weight:600; font-size:13px;
    padding:9px 10px; border-bottom:2px solid var(--line);
  }
  table.tbl td{ padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.tbl tr:last-child td{ border-bottom:none; }
  table.tbl tbody tr:hover{ background:#fafcfb; }
  .pill{ display:inline-block; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:700; }
  .pill-admin{ background:var(--amber-tint); color:var(--amber); }
  .pill-employee{ background:var(--teal-tint); color:var(--teal-dark); }
  .empty-state{ text-align:center; padding:40px 20px; color:var(--ink-soft); }
  .empty-state .big{ font-size:34px; margin-bottom:8px; }

  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
  @media (max-width:720px){ .row2,.row3{ grid-template-columns:1fr; } .sidebar{ display:none; } .content{padding:18px;} }

  .items-table th, .items-table td{ padding:8px 6px; }
  .items-table input{ width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; }
  .icon-btn{ background:transparent; border:none; color:var(--danger); font-size:15px; padding:4px 8px; border-radius:6px; }
  .icon-btn:hover{ background:var(--danger-tint); }
  .totals-box{ margin-top:16px; margin-inline-start:auto; width:280px; }
  .totals-box .line{ display:flex; justify-content:space-between; padding:8px 0; font-size:14.5px; color:var(--ink-soft); border-bottom:1px dashed var(--line); }
  .totals-box .line.grand{ color:var(--teal-dark); font-weight:800; font-size:19px; border-bottom:none; padding-top:12px; font-family:'Cairo',sans-serif; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(23,38,43,.45); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow:auto;
  }
  .modal-box{
    background:#fff; border-radius:14px; max-width:900px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; padding:16px 22px; border-bottom:1px solid var(--line); }
  .modal-head h3{ margin:0; }
  .modal-close{ background:transparent; border:none; font-size:20px; color:var(--ink-soft); }
  .modal-body{ padding:22px; max-height:75vh; overflow:auto; }

  .toast-wrap{ position:fixed; bottom:22px; inset-inline-start:22px; z-index:80; display:flex; flex-direction:column; gap:8px; }
  .toast{
    background:var(--ink); color:#fff; padding:12px 18px; border-radius:8px; font-size:14px;
    box-shadow:var(--shadow); animation:toastIn .18s ease-out;
  }
  .toast.err{ background:var(--danger); }
  .toast.ok{ background:var(--teal); }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Printable A4 invoice ---------- */
  #printArea{ display:none; }
  .invoice-sheet{
    width:210mm; min-height:297mm; margin:0 auto; background:#fff; color:#1a1a1a;
    padding:16mm 14mm; font-family:'Tajawal', sans-serif;
  }
  .inv-head{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid var(--teal); padding-bottom:14px; margin-bottom:18px; }
  .inv-head .co-logo{ max-width:80px; max-height:80px; object-fit:contain; margin-bottom:8px; }
  .inv-head .co-name{ font-family:'Cairo',sans-serif; font-weight:800; font-size:20px; color:var(--teal-dark); }
  .inv-head .co-meta{ font-size:12.5px; color:#555; line-height:1.8; margin-top:4px; }
  .inv-head .inv-title{ text-align:start; }
  .inv-head .inv-title h2{ font-family:'Cairo',sans-serif; margin:0; color:var(--teal-dark); font-size:24px; }
  .inv-head .inv-title .inv-no{ font-family:'Cairo',sans-serif; font-size:15px; color:var(--amber); font-weight:700; margin-top:4px; }
  .inv-head .inv-title .inv-date{ font-size:12.5px; color:#555; margin-top:4px; }
  .inv-parties{ display:flex; gap:20px; margin-bottom:20px; }
  .inv-parties .box{ flex:1; background:#f5f7f6; border-radius:8px; padding:12px 14px; }
  .inv-parties .box .t{ font-size:11.5px; color:#888; margin-bottom:4px; }
  .inv-parties .box .n{ font-weight:700; font-size:14.5px; }
  table.inv-items{ width:100%; border-collapse:collapse; margin-bottom:16px; }
  table.inv-items th{ background:var(--teal-dark); color:#fff; padding:9px 10px; font-size:12.5px; text-align:start; }
  table.inv-items td{ padding:9px 10px; border-bottom:1px solid #e3e3e3; font-size:13.5px; }
  table.inv-items tr:nth-child(even) td{ background:#fafafa; }
  .inv-totals{ margin-inline-start:auto; width:260px; }
  .inv-totals .l{ display:flex; justify-content:space-between; padding:6px 0; font-size:13.5px; color:#444; }
  .inv-totals .l.grand{ border-top:2px solid var(--teal); margin-top:6px; padding-top:10px; font-weight:800; font-size:17px; color:var(--teal-dark); }
  .inv-notes{ margin-top:26px; font-size:12.5px; color:#555; }
  .inv-sign{ display:flex; justify-content:space-between; margin-top:60px; }
  .inv-sign .s{ width:40%; text-align:center; border-top:1px solid #999; padding-top:6px; font-size:12px; color:#666; }
  .inv-foot{ margin-top:30px; text-align:center; font-size:11px; color:#999; border-top:1px solid #eee; padding-top:10px; }

  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ display:block; position:absolute; inset:0; }
    .invoice-sheet{ box-shadow:none; margin:0; }
    @page{ size:A4; margin:0; }
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-mark">ف</div>
    <h1>تسجيل الدخول</h1>
    <p class="sub">منظومة إدارة الفواتير والمبيعات</p>
    <div id="loginError"></div>
    <form id="loginForm">
      <div class="field">
        <label>اسم المستخدم</label>
        <input type="text" id="loginUser" autocomplete="username" required>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="loginPass" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">دخول</button>
    </form>
    <div class="login-hint">
      الحساب الافتراضي عند أول تشغيل:<br>
      اسم المستخدم: <b>admin</b> — كلمة المرور: <b>admin123</b><br>
      يفضل تغيير كلمة المرور فور الدخول من صفحة «حسابي».
    </div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="appShell" class="hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">ف</div>
      <div class="name" id="brandName">منظومة الفواتير<small>إدارة المبيعات</small></div>
    </div>
    <nav>
      <button class="nav-item" data-view="dashboard"><span class="ic">▦</span> الرئيسية</button>
      <button class="nav-item" data-view="newInvoice"><span class="ic">＋</span> فاتورة جديدة</button>
      <button class="nav-item" data-view="invoices"><span class="ic">≡</span> الفواتير</button>
      <button class="nav-item" data-view="employees" id="navEmployees"><span class="ic">👤</span> الموظفون</button>
      <button class="nav-item" data-view="settings" id="navSettings"><span class="ic">⚙</span> إعدادات الشركة</button>
      <button class="nav-item" data-view="account"><span class="ic">🔑</span> حسابي</button>
    </nav>
    <div class="sidebar-foot">
      <div class="sidebar-user">مسجل الدخول باسم<b id="sidebarUserName">-</b></div>
      <button class="btn btn-ghost btn-sm" style="width:100%; color:#fff; border-color:rgba(255,255,255,.25);" onclick="App.logout()">تسجيل الخروج</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">الرئيسية</h2>
      <div style="font-size:13px;color:var(--ink-soft);" id="topbarDate"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div id="modalRoot"></div>
<div id="printArea"></div>

<script>
/* =========================================================
   منظومة الفواتير — تخزين محلي بالكامل (localStorage)
   ========================================================= */
const DB_KEY = 'invoice_system_db_v1';
const SESSION_KEY = 'invoice_system_session_v1';

const Store = {
  load(){
    let raw = localStorage.getItem(DB_KEY);
    if(!raw){
      const initial = {
        users: [
          { id: 'u_admin', username:'admin', password:'admin123', name:'المدير العام', role:'admin', active:true }
        ],
        company: { name:'اسم شركتك', phone:'', address:'', taxNumber:'', currency:'د.ل', logo:'' },
        invoices: [],
        nextInvoiceNumber: 1
      };
      localStorage.setItem(DB_KEY, JSON.stringify(initial));
      return initial;
    }
    return JSON.parse(raw);
  },
  save(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); },
};

let db = Store.load();
let session = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
let currentView = 'dashboard';
let invoiceDraft = null; // items being built in the new-invoice form

function persist(){ Store.save(db); }
function currentUser(){ return db.users.find(u => u.id === session?.userId) || null; }
function isAdmin(){ return currentUser()?.role === 'admin'; }

function toast(msg, type=''){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=> el.remove(), 3200);
}
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return (Math.round((n+Number.EPSILON)*100)/100).toFixed(2); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ---------------- AUTH ---------------- */
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const user = db.users.find(x => x.username === u && x.password === p);
  const errBox = document.getElementById('loginError');
  errBox.innerHTML = '';
  if(!user){
    errBox.innerHTML = '<div class="login-error">اسم المستخدم أو كلمة المرور غير صحيحة.</div>';
    return;
  }
  if(user.active === false){
    errBox.innerHTML = '<div class="login-error">هذا الحساب معطّل. تواصل مع المدير.</div>';
    return;
  }
  session = { userId: user.id };
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
  boot();
});

const App = {
  logout(){
    session = null;
    sessionStorage.removeItem(SESSION_KEY);
    location.reload();
  }
};

/* ---------------- NAV ---------------- */
document.querySelectorAll('.nav-item[data-view]').forEach(btn=>{
  btn.addEventListener('click', ()=> navigate(btn.dataset.view));
});

function navigate(view){
  if((view==='employees' || view==='settings') && !isAdmin()){ view = 'dashboard'; }
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(b=> b.classList.toggle('active', b.dataset.view===view));
  const titles = {
    dashboard:'الرئيسية', newInvoice:'فاتورة جديدة', invoices:'الفواتير',
    employees:'إدارة الموظفين', settings:'إعدادات الشركة', account:'حسابي'
  };
  document.getElementById('pageTitle').textContent = titles[view] || '';
  render();
}

/* ---------------- BOOT ---------------- */
function boot(){
  if(!session || !currentUser()){
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('appShell').classList.add('hidden');
    return;
  }
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  document.getElementById('navEmployees').style.display = isAdmin() ? '' : 'none';
  document.getElementById('navSettings').style.display = isAdmin() ? '' : 'none';
  document.getElementById('sidebarUserName').textContent = currentUser().name + (isAdmin() ? ' (مدير)' : ' (موظف)');
  document.getElementById('brandName').innerHTML = esc(db.company.name || 'منظومة الفواتير') + '<small>إدارة المبيعات</small>';
  document.getElementById('topbarDate').textContent = new Date().toLocaleDateString('ar-LY', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  navigate(currentView);
}

/* ---------------- RENDER ROUTER ---------------- */
function render(){
  const c = document.getElementById('content');
  if(currentView === 'dashboard') c.innerHTML = viewDashboard();
  else if(currentView === 'newInvoice'){ if(!invoiceDraft) resetDraft(); c.innerHTML = viewNewInvoice(); bindInvoiceForm(); }
  else if(currentView === 'invoices') c.innerHTML = viewInvoices();
  else if(currentView === 'employees') c.innerHTML = viewEmployees();
  else if(currentView === 'settings') c.innerHTML = viewSettings();
  else if(currentView === 'account') c.innerHTML = viewAccount();
}

/* ================= DASHBOARD ================= */
function viewDashboard(){
  const my = isAdmin() ? db.invoices : db.invoices.filter(i => i.createdBy === currentUser().id);
  const today = todayISO();
  const thisMonth = today.slice(0,7);
  const totalAll = my.reduce((s,i)=> s + i.grandTotal, 0);
  const totalToday = my.filter(i=> i.date === today).reduce((s,i)=> s + i.grandTotal, 0);
  const totalMonth = my.filter(i=> i.date.slice(0,7) === thisMonth).reduce((s,i)=> s + i.grandTotal, 0);
  const recent = [...my].sort((a,b)=> b.createdAt - a.createdAt).slice(0,6);

  return `
    <div class="grid-cards">
      <div class="stat-card"><div class="lbl">عدد الفواتير</div><div class="val">${my.length}</div></div>
      <div class="stat-card amber"><div class="lbl">مبيعات اليوم</div><div class="val">${money(totalToday)} ${esc(db.company.currency)}</div></div>
      <div class="stat-card"><div class="lbl">مبيعات هذا الشهر</div><div class="val">${money(totalMonth)} ${esc(db.company.currency)}</div></div>
      <div class="stat-card"><div class="lbl">إجمالي المبيعات</div><div class="val">${money(totalAll)} ${esc(db.company.currency)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h3>آخر الفواتير</h3>
        <button class="btn btn-primary btn-sm" onclick="navigate('newInvoice')">＋ فاتورة جديدة</button>
      </div>
      <div class="panel-body">
        ${ recent.length ? `
        <table class="tbl">

/* ================= NEW INVOICE ================= */
function resetDraft(){
  invoiceDraft = {
    customerName:'', customerPhone:'', date: todayISO(),
    items:[ { desc:'', qty:1, price:0 } ],
    discountPercent:0, taxPercent:0, notes:''
  };
}

function viewNewInvoice(){
  const d = invoiceDraft;
  return `
  <div class="panel">
    <div class="panel-head"><h3>بيانات الفاتورة</h3></div>
    <div class="panel-body">
      <div class="row2">
        <div class="field"><label>اسم العميل</label><input id="f_customerName" value="${esc(d.customerName)}"></div>
        <div class="field"><label>رقم هاتف العميل</label><input id="f_customerPhone" value="${esc(d.customerPhone)}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>تاريخ الفاتورة</label><input type="date" id="f_date" value="${d.date}"></div>
        <div></div>
      </div>

      <table class="tbl items-table" id="itemsTable">
        <thead><tr><th style="width:44%">الوصف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr></thead>
        <tbody id="itemsBody"></tbody>
      </table>
      <button class="btn btn-ghost btn-sm" id="addItemBtn" style="margin-top:10px;">＋ إضافة سطر</button>

      <div class="row2" style="margin-top:20px;">
        <div class="field"><label>نسبة الخصم %</label><input type="number" id="f_discount" min="0" max="100" value="${d.discountPercent}"></div>

      </div>

      <div class="totals-box" id="totalsBox"></div>

      <div style="display:flex; gap:10px; margin-top:22px; justify-content:flex-end;">
        <button class="btn btn-ghost" id="btnResetInvoice">تفريغ النموذج</button>
        <button class="btn btn-primary" id="btnSaveInvoice">حفظ الفاتورة</button>
      </div>

}

function bindInvoiceForm(){
  const d = invoiceDraft;
  const ids = ['f_customerName','f_customerPhone','f_date','f_discount','f_tax','f_notes'];
  ids.forEach(id => {
    document.getElementById(id).addEventListener('input', e => {
      const map = { f_customerName:'customerName', f_customerPhone:'customerPhone', f_date:'date', f_discount:'discountPercent', f_tax:'taxPercent', f_notes:'notes' };
      const key = map[id];
      d[key] = (id==='f_discount'||id==='f_tax') ? (parseFloat(e.target.value)||0) : e.target.value;
      renderTotals();
    });
  });
  document.getElementById('addItemBtn').addEventListener('click', ()=>{
    d.items.push({ desc:'', qty:1, price:0 });
    renderItems();
  });
  document.getElementById('btnResetInvoice').addEventListener('click', ()=>{
    if(confirm('تفريغ جميع بيانات الفاتورة الحالية؟')){ resetDraft(); render(); }
  });
  document.getElementById('btnSaveInvoice').addEventListener('click', saveInvoice);
  renderItems();
}

function renderItems(){
  const d = invoiceDraft;
  const body = document.getElementById('itemsBody');
  body.innerHTML = d.items.map((it, idx) => `
    <tr data-idx="${idx}">
      <td><input class="it-desc" value="${esc(it.desc)}" placeholder="اسم الصنف / الخدمة"></td>
      <td><input class="it-qty" type="number" min="0" step="1" value="${it.qty}" style="width:80px"></td>
      <td><input class="it-price" type="number" min="0" step="0.01" value="${it.price}" style="width:100px"></td>
      <td class="it-total">${money(it.qty*it.price)}</td>
      <td>${ d.items.length>1 ? `<button class="icon-btn" title="حذف السطر">✕</button>` : '' }</td>
    </tr>
  `).join('');

  body.querySelectorAll('tr').forEach(tr => {
    const idx = parseInt(tr.dataset.idx);
    tr.querySelector('.it-desc').addEventListener('input', e=>{ d.items[idx].desc = e.target.value; });
    tr.querySelector('.it-qty').addEventListener('input', e=>{ d.items[idx].qty = parseFloat(e.target.value)||0; tr.querySelector('.it-total').textContent = money(d.items[idx].qty*d.items[idx].price); renderTotals(); });
    tr.querySelector('.it-price').addEventListener('input', e=>{ d.items[idx].price = parseFloat(e.target.value)||0; tr.querySelector('.it-total').textContent = money(d.items[idx].qty*d.items[idx].price); renderTotals(); });
    const delBtn = tr.querySelector('.icon-btn');
    if(delBtn) delBtn.addEventListener('click', ()=>{ d.items.splice(idx,1); renderItems(); renderTotals(); });
  });
  renderTotals();
}

function computeTotals(d){
  const subtotal = d.items.reduce((s,it)=> s + (it.qty*it.price), 0);
  const discountAmount = subtotal * (d.discountPercent/100);
  const afterDiscount = subtotal - discountAmount;
  const taxAmount = afterDiscount * (d.taxPercent/100);
  const grandTotal = afterDiscount + taxAmount;
  return { subtotal, discountAmount, taxAmount, grandTotal };
}

function renderTotals(){
  const d = invoiceDraft;
  const t = computeTotals(d);
  document.getElementById('totalsBox').innerHTML = `
    <div class="line"><span>المجموع الفرعي</span><span>${money(t.subtotal)} ${esc(db.company.currency)}</span></div>
    <div class="line"><span>الخصم (${d.discountPercent}%)</span><span>- ${money(t.discountAmount)} ${esc(db.company.currency)}</span></div>
    <div class="line"><span>الضريبة (${d.taxPercent}%)</span><span>+ ${money(t.taxAmount)} ${esc(db.company.currency)}</span></div>
    <div class="line grand"><span>الإجمالي</span><span>${money(t.grandTotal)} ${esc(db.company.currency)}</span></div>
  `;
}

function saveInvoice(){
  const d = invoiceDraft;
  if(!d.customerName.trim()){ toast('يرجى إدخال اسم العميل', 'err'); return; }
  const validItems = d.items.filter(it => it.desc.trim() !== '');
  if(validItems.length === 0){ toast('أضف صنفاً واحداً على الأقل', 'err'); return; }
  const t = computeTotals({ ...d, items: validItems });
  const invoice = {
    id: 'inv_' + Date.now(),
    number: String(db.nextInvoiceNumber).padStart(4,'0'),
    date: d.date || todayISO(),
    customerName: d.customerName.trim(),
    customerPhone: d.customerPhone.trim(),
    items: validItems,
    discountPercent: d.discountPercent,
    taxPercent: d.taxPercent,
    notes: d.notes,
    subtotal: t.subtotal, discountAmount: t.discountAmount, taxAmount: t.taxAmount, grandTotal: t.grandTotal,
    createdBy: currentUser().id,
    createdByName: currentUser().name,
    createdAt: Date.now()
  };
  db.invoices.push(invoice);
  db.nextInvoiceNumber += 1;
  persist();
  toast('تم حفظ الفاتورة بنجاح', 'ok');
  resetDraft();
  navigate('invoices');
  setTimeout(()=> printInvoice(invoice.id), 150);
}

/* ================= INVOICES LIST ================= */

    <tbody>
      ${list.map(i => `
        <tr>
          <td>#${i.number}</td>

          <td>${i.date}</td>

function deleteInvoice(id){
  if(!confirm('هل تريد حذف هذه الفاتورة نهائياً؟')) return;
  db.invoices = db.invoices.filter(i=> i.id!==id);
  persist();
  render();

}

document.addEventListener('input', e=>{
  if(e.target.id === 'searchInvoices'){

function openEmployeeModal(id){
  const editing = id ? db.users.find(u=>u.id===id) : null;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="empOverlay">
      <div class="modal-box" style="max-width:460px;">
        <div class="modal-head"><h3>${editing?'تعديل حساب موظف':'إضافة موظف جديد'}</h3><button class="modal-close" id="empClose">✕</button></div>
        <div class="modal-body">
          <div class="field"><label>الاسم الكامل</label><input id="emp_name" value="${editing?esc(editing.name):''}"></div>
          <div class="field"><label>اسم المستخدم</label><input id="emp_username" value="${editing?esc(editing.username):''}"></div>
          <div class="field"><label>كلمة المرور ${editing?'(اتركها فارغة لعدم التغيير)':''}</label><input type="text" id="emp_password" placeholder="${editing?'••••••':''}"></div>
          <div class="field"><label>الصلاحية</label>
            <select id="emp_role">
              <option value="employee" ${editing&&editing.role==='employee'?'selected':''}>موظف</option>
              <option value="admin" ${editing&&editing.role==='admin'?'selected':''}>مدير</option>
            </select>
          </div>
          ${ editing ? `<div class="field"><label><input type="checkbox" id="emp_active" ${editing.active!==false?'checked':''} style="width:auto;margin-inline-end:6px;">الحساب نشط</label></div>` : '' }
          <button class="btn btn-primary" style="width:100%;margin-top:8px;" id="empSave">${editing?'حفظ التعديلات':'إضافة الحساب'}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('empClose').onclick = ()=> root.innerHTML='';
  document.getElementById('empOverlay').addEventListener('click', e=>{ if(e.target.id==='empOverlay') root.innerHTML=''; });
  document.getElementById('empSave').onclick = ()=>{
    const name = document.getElementById('emp_name').value.trim();
    const username = document.getElementById('emp_username').value.trim();
    const password = document.getElementById('emp_password').value;
    const role = document.getElementById('emp_role').value;
    if(!name || !username){ toast('يرجى تعبئة الاسم واسم المستخدم', 'err'); return; }
    const dupe = db.users.find(u=> u.username===username && (!editing || u.id!==editing.id));
    if(dupe){ toast('اسم المستخدم مستخدم بالفعل', 'err'); return; }
    if(editing){
      editing.name = name; editing.username = username; editing.role = role;
      if(password) editing.password = password;
      const activeBox = document.getElementById('emp_active');
      if(activeBox) editing.active = activeBox.checked;
    } else {
      if(!password){ toast('يرجى إدخال كلمة مرور للحساب الجديد', 'err'); return; }
      db.users.push({ id:'u_'+Date.now(), name, username, password, role, active:true });
    }
    persist();
    root.innerHTML='';
    render();
    toast('تم الحفظ بنجاح', 'ok');
  };
}

function deleteEmployee(id){
  const admins = db.users.filter(u=>u.role==='admin');
  const target = db.users.find(u=>u.id===id);
  if(target.role==='admin' && admins.length<=1){ toast('لا يمكن حذف آخر حساب مدير', 'err'); return; }
  if(!confirm('هل تريد حذف هذا الحساب؟')) return;
  db.users = db.users.filter(u=>u.id!==id);
  persist();
  render();
  toast('تم حذف الحساب', 'ok');
}

function bindSettingsForm(){

  btn.addEventListener('click', ()=>{
    db.company.name = document.getElementById('c_name').value.trim();
    db.company.phone = document.getElementById('c_phone').value.trim();
    db.company.taxNumber = document.getElementById('c_tax').value.trim();

function bindAccountForm(){
  const btn = document.getElementById('saveMeBtn');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    const u = currentUser();
    const username = document.getElementById('me_username').value.trim();
    const dupe = db.users.find(x=> x.username===username && x.id!==u.id);
    if(dupe){ toast('اسم المستخدم مستخدم بالفعل', 'err'); return; }

    toast('تم تحديث حسابك', 'ok');

  });

/* hook post-render bindings for settings/account (since render() rebuilds innerHTML) */
const _origRender = render;
render = function(){
  _origRender();
  if(currentView==='settings') bindSettingsForm();
  if(currentView==='account') bindAccountForm();
};

/* ---------------- INIT ---------------- */
boot();
